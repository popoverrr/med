# Превью для заказчика на GitHub Pages: https://popoverrr.github.io/med/
# Сборка параметризована переменными окружения (см. src/content/config/site.mjs):
# сайт живёт в подпути /med, noindex, формы отключены (PHP на Pages не работает).
# Боевая выкладка на Plesk — по DEPLOY.md, обычный `npm run build` без этих переменных.
name: Preview (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (preview under /med)
        run: npm run build
        env:
          SITE_URL: https://popoverrr.github.io
          SITE_BASE: /med
          PUBLIC_PREVIEW: '1'
      - name: Preview must not be indexed
        run: printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
